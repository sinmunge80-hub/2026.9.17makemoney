<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3d2b" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E" />
<title>질문게시판 · 메이크머니 해빗챌린지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="qna">
<main>
  <div class="card">
    <h2>궁금한 점 물어보기 ✋</h2>
    <form id="questionForm">
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="챌린지 닉네임" required />
      </div>

      <div class="field">
        <label>제목</label>
        <input type="text" id="title" placeholder="무엇이 궁금하신가요?" required />
      </div>

      <div class="field">
        <label>내용</label>
        <textarea id="content" placeholder="자세한 내용을 적어주시면 더 정확히 답변드릴 수 있어요" required></textarea>
      </div>

      <button type="submit" class="btn">질문 남기기</button>
    </form>
  </div>

  <div class="card">
    <h2>질문 목록</h2>
    <div id="questionList">
      <p class="empty-msg">불러오는 중...</p>
    </div>
  </div>
</main>

<script type="module" src="js/qna.js"></script>
</body>
</html>
