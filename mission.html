<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3d2b" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E" />
<title>과제·미션 · 메이크머니 해빗챌린지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="mission">
<main>
  <div class="card">
    <h2>이달의 도서 📚</h2>
    <div id="bookList"></div>
  </div>

  <div class="card">
    <h2>오늘의 과제 등록하기 ✍️</h2>
    <p class="desc-text" style="margin-bottom:14px;">
      운영자님만 새 과제를 올려주세요. 멤버분들은 아래 목록에서 과제를 확인하고 인증해주시면 돼요.
    </p>
    <form id="missionForm">
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="챌린지 닉네임" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label>주차</label>
          <select id="weekNum">
            <option value="1">1주차</option>
            <option value="2">2주차</option>
            <option value="3">3주차</option>
            <option value="4">4주차</option>
          </select>
        </div>
        <div class="field">
          <label>일차</label>
          <select id="dayNum">
            <option value="1">1일차</option>
            <option value="2">2일차</option>
            <option value="3">3일차</option>
            <option value="4">4일차</option>
            <option value="5">5일차</option>
            <option value="6">6일차</option>
            <option value="7">7일차</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>과제 제목 <span class="hint">(선택)</span></label>
        <input type="text" id="title" placeholder="예: 이번 달 고정지출 점검하기" />
      </div>

      <div class="field">
        <label>과제 내용</label>
        <textarea id="content" placeholder="오늘의 과제 내용을 적어주세요" required></textarea>
      </div>

      <button type="submit" class="btn">과제 등록하기</button>
    </form>
  </div>

  <div class="card">
    <h2>과제 목록</h2>
    <div id="missionList">
      <p class="empty-msg">불러오는 중...</p>
    </div>
  </div>
</main>

<script type="module" src="js/mission.js"></script>
</body>
</html>
