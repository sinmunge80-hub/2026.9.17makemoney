<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#059669" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E" />
<title>일일 가계부 인증 · 메이크머니 해빗챌린지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="daily">
<main>
  <div class="card">
    <h2>오늘의 가계부 인증 <span class="sub" id="dateLabel"></span></h2>
    <form id="dailyForm">
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="챌린지 닉네임" required />
      </div>

      <div class="field">
        <label>고정지출 <span class="hint">(월세·보험료·구독료 등, 없으면 0)</span></label>
        <input type="number" id="fixedSpend" inputmode="numeric" placeholder="예: 15000" min="0" />
      </div>

      <div class="field">
        <label>변동지출 <span class="hint">(식비·교통비·쇼핑 등, 없으면 0)</span></label>
        <input type="number" id="variableSpend" inputmode="numeric" placeholder="예: 8000" min="0" />
      </div>

      <div class="field">
        <label>가계부 사진 <span class="hint">(선택)</span></label>
        <div class="file-input-wrap">
          <input type="file" id="photo" accept="image/*" capture="environment" />
          <img id="photoPreview" class="photo-preview" alt="미리보기" />
        </div>
      </div>

      <div class="field">
        <label>한줄 소감 / 메모</label>
        <textarea id="memo" placeholder="오늘 지출에서 아낀 점, 다짐 한마디를 남겨보세요"></textarea>
      </div>

      <button type="submit" class="btn">인증하기 🙌</button>
    </form>
  </div>

  <div class="notice" id="aiKeyNotice" style="display:none;">
    🔑 인증 후 AI 응원 댓글을 받고 싶다면 <a href="settings.html">설정</a>에서 Gemini API 키를 등록해주세요.
  </div>

  <div class="card ai-card" id="aiCard" style="display:none;">
    <h2>🤖 AI 응원 댓글</h2>
    <div class="ai-content" id="aiContent"></div>
    <div class="ai-actions">
      <button type="button" id="aiCopyBtn" class="btn btn-outline">복사하기</button>
      <button type="button" id="aiRetryBtn" class="btn btn-outline">다시 받기</button>
    </div>
  </div>

  <div class="card">
    <h2>최근 인증 기록</h2>
    <div id="entryList">
      <p class="empty-msg">불러오는 중...</p>
    </div>
  </div>
</main>

<script type="module" src="js/daily.js"></script>
</body>
</html>
